<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Routine Monsters</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="rm-root">
  <div class="rm-shell" id="shell">

    <!-- ローディング表示 -->
    <div class="rm-loading" id="loading">
      <div class="rm-loading-dot"></div>
      <p>よみこみちゅう…</p>
    </div>

    <!-- アプリ本体（読み込み完了後に表示） -->
    <div id="app-content" hidden>

      <header class="rm-header">
        <div class="rm-brand">
          <span class="rm-brand-mark">RM</span>
          <h1>Routine Monsters</h1>
        </div>
        <div class="rm-coin">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>
          <span id="points-value">0</span>
        </div>
      </header>

      <main class="rm-main">

        <!-- ============== ホームタブ ============== -->
        <section class="rm-section" id="tab-home">
          <div>
            <h2 class="rm-h2">今日のルーティン</h2>
            <p class="rm-sub" id="home-date-summary"></p>
          </div>

          <div class="rm-card">
            <div class="rm-streak-row">
              <div class="rm-streak-flame">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
              </div>
              <div>
                <div class="rm-streak-num"><span id="streak-num">0</span><span style="font-size:13px;font-weight:500;"> 日連続</span></div>
                <div class="rm-streak-label">続けるほどボーナスptが増える</div>
              </div>
            </div>
            <div class="rm-today-bar">
              <div class="rm-bar-track"><div class="rm-bar-fill" id="today-bar-fill" style="width:0%"></div></div>
            </div>
          </div>

          <div class="rm-weekly-banner" id="weekly-banner" hidden>
            <p id="weekly-banner-text"></p>
            <button class="rm-btn rm-btn-amber" id="claim-weekly-btn">受け取る</button>
          </div>

          <div id="routine-list" style="display:flex;flex-direction:column;gap:10px;"></div>

          <button class="rm-add-trigger" id="add-routine-trigger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            ルーティンを追加
          </button>
        </section>

        <!-- ============== ガチャタブ ============== -->
        <section class="rm-section" id="tab-gacha" hidden>
          <div>
            <h2 class="rm-h2">モンスターガチャ</h2>
            <p class="rm-sub">ポイントを使ってモンスターと出会おう</p>
          </div>

          <div class="rm-gacha-stage">
            <button class="rm-egg" id="gacha-egg-btn">
              <svg viewBox="0 0 140 170" width="140" height="170">
                <ellipse cx="70" cy="95" rx="58" ry="68" fill="#F3E6C4" stroke="#DA9C34" stroke-width="4" />
                <path d="M20 80 Q70 40 120 80" fill="none" stroke="#DA9C34" stroke-width="4" />
                <circle cx="50" cy="70" r="6" fill="#DA9C34" opacity="0.5" />
                <circle cx="90" cy="110" r="4" fill="#DA9C34" opacity="0.5" />
              </svg>
            </button>
            <p class="rm-gacha-cost" id="gacha-cost-text"></p>
            <p class="rm-gacha-hint">タップしてガチャを回す。モンスター本体かモンスターのかけらが出るよ。</p>
          </div>

          <div class="rm-rarity-legend">
            <div class="rm-rarity-chip"><span class="rm-rarity-dot" style="background:#8A9A8E"></span>ノーマル</div>
            <div class="rm-rarity-chip"><span class="rm-rarity-dot" style="background:#3E7CB1"></span>レア</div>
            <div class="rm-rarity-chip"><span class="rm-rarity-dot" style="background:#8A4FBF"></span>スーパーレア</div>
            <div class="rm-rarity-chip"><span class="rm-rarity-dot" style="background:#C9962E"></span>ウルトラレア</div>
          </div>

          <div>
            <h2 class="rm-h2" style="font-size:16px;">最近のガチャ結果</h2>
            <div class="rm-history-list" id="pulls-list" style="margin-top:8px;"></div>
          </div>
        </section>

        <!-- ============== 図鑑タブ ============== -->
        <section class="rm-section" id="tab-collection" hidden>
          <div class="rm-collection-summary">
            <div>
              <h2 class="rm-h2">モンスター図鑑</h2>
              <p class="rm-sub" id="collection-count"></p>
            </div>
            <div class="rm-collection-pct" id="collection-pct"></div>
          </div>

          <div class="rm-monster-grid" id="monster-grid"></div>
        </section>

        <!-- ============== ログタブ ============== -->
        <section class="rm-section" id="tab-log" hidden>
          <div>
            <h2 class="rm-h2">達成ログ</h2>
            <p class="rm-sub">生活改善の記録</p>
          </div>

          <div class="rm-log-grid-row">
            <div class="rm-stat-box">
              <div class="rm-stat-num" id="stat-streak">0</div>
              <div class="rm-stat-label">連続達成日数</div>
            </div>
            <div class="rm-stat-box">
              <div class="rm-stat-num" id="stat-week-pct">0%</div>
              <div class="rm-stat-label">週間達成率</div>
            </div>
            <div class="rm-stat-box">
              <div class="rm-stat-num" id="stat-month-pct">0%</div>
              <div class="rm-stat-label">月間達成率</div>
            </div>
          </div>

          <div class="rm-card">
            <p class="rm-sub" style="margin-bottom:8px;">過去28日間</p>
            <div class="rm-heatmap" id="heatmap"></div>
          </div>

          <div>
            <h2 class="rm-h2" style="font-size:16px;">ポイント履歴</h2>
            <div class="rm-history-list" id="history-list" style="margin-top:8px;"></div>
          </div>
        </section>

      </main>

      <nav class="rm-tabbar">
        <button class="rm-tab-btn active" data-tab="home">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>ホーム</span>
        </button>
        <button class="rm-tab-btn" data-tab="gacha">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
          <span>ガチャ</span>
        </button>
        <button class="rm-tab-btn" data-tab="collection">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
          <span>図鑑</span>
        </button>
        <button class="rm-tab-btn" data-tab="log">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 16v3"/><path d="M12 11v8"/><path d="M17 6v13"/></svg>
          <span>ログ</span>
        </button>
      </nav>

      <div class="rm-floater-layer" id="floater-layer"></div>
    </div>

    <!-- ============== モーダル：ガチャ結果 ============== -->
    <div class="rm-modal-backdrop" id="modal-gacha-result" hidden>
      <div class="rm-modal">
        <div id="gacha-result-icon"></div>
        <div class="rm-modal-title" id="gacha-result-title"></div>
        <div class="rm-modal-sub" id="gacha-result-sub"></div>
        <button class="rm-btn rm-btn-amber" style="width:100%" id="gacha-result-close">とじる</button>
      </div>
    </div>

    <!-- ============== モーダル：合成結果 ============== -->
    <div class="rm-modal-backdrop" id="modal-synth-result" hidden>
      <div class="rm-modal">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#DA9C34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
        <div id="synth-result-icon"></div>
        <div class="rm-modal-title" id="synth-result-title"></div>
        <div class="rm-modal-sub" id="synth-result-sub"></div>
        <button class="rm-btn rm-btn-amber" style="width:100%" id="synth-result-close">とじる</button>
      </div>
    </div>

    <!-- ============== モーダル：モンスター詳細 ============== -->
    <div class="rm-modal-backdrop" id="modal-detail" hidden>
      <div class="rm-modal">
        <button class="rm-icon-btn" style="float:right" id="detail-close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
        <div id="detail-icon"></div>
        <div class="rm-modal-title" id="detail-title"></div>
        <div class="rm-modal-sub" id="detail-sub"></div>

        <div id="detail-discovered-area" hidden>
          <div class="rm-modal-desc" id="detail-desc"></div>
          <div class="rm-detail-frag-bar">
            <div class="rm-detail-frag-label"><span>かけら</span><span id="detail-frag-count"></span></div>
            <div class="rm-bar-track"><div class="rm-bar-fill" id="detail-frag-fill" style="width:0%"></div></div>
          </div>
          <p class="rm-sub" style="margin-bottom:14px;" id="detail-obtained-text"></p>
          <button class="rm-btn rm-btn-amber" style="width:100%" id="detail-synth-btn" hidden>かけらを合成する</button>
        </div>

        <div id="detail-locked-area" hidden>
          <div class="rm-modal-desc" style="display:flex;align-items:center;gap:8px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            まだ出会っていないモンスター。ガチャを回して見つけよう。
          </div>
          <p class="rm-sub" id="detail-needed-text"></p>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- ============== テンプレート（ルーティン行） ============== -->
<template id="tpl-routine-row">
  <div class="rm-routine-row" data-id="">
    <button class="rm-check" data-action="toggle">
      <svg class="check-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M20 6 9 17l-5-5"/></svg>
    </button>
    <span class="rm-routine-name" data-field="name"></span>
    <span class="rm-weight-badge" data-field="weight"></span>
    <button class="rm-icon-btn" data-action="edit">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
    </button>
    <button class="rm-icon-btn" data-action="delete">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
  </div>
</template>

<!-- ============== テンプレート（追加・編集フォーム） ============== -->
<template id="tpl-routine-form">
  <div class="rm-add-form">
    <input class="rm-input" data-field="name-input" placeholder="ルーティン名（例：読書10分）" maxlength="20" />
    <div class="rm-weight-toggle">
      <div class="rm-weight-opt" data-weight="1">かるい<br />10pt</div>
      <div class="rm-weight-opt" data-weight="2">ふつう<br />20pt</div>
      <div class="rm-weight-opt" data-weight="3">しっかり<br />30pt</div>
    </div>
    <div class="rm-form-actions">
      <button class="rm-btn rm-btn-ghost" data-action="cancel">キャンセル</button>
      <button class="rm-btn rm-btn-amber" data-action="save"></button>
    </div>
  </div>
</template>

<!-- ============== テンプレート（ガチャ結果1件） ============== -->
<template id="tpl-pull-item">
  <div class="rm-pull-item">
    <div class="pull-icon"></div>
    <span class="rm-pull-text" data-field="text"></span>
    <span class="rm-pull-time" data-field="time"></span>
  </div>
</template>

<!-- ============== テンプレート（履歴1件） ============== -->
<template id="tpl-history-item">
  <div class="rm-pull-item">
    <span class="rm-pull-text" data-field="reason"></span>
    <span data-field="delta" style="font-weight:700;font-size:12.5px;"></span>
    <span class="rm-pull-time" data-field="time"></span>
  </div>
</template>

<!-- ============== テンプレート（図鑑セル） ============== -->
<template id="tpl-monster-cell">
  <div class="rm-monster-cell" data-id="">
    <div class="cell-icon"></div>
    <span class="rm-monster-cell-name" data-field="name"></span>
    <span class="rm-monster-cell-frag" data-field="frag"></span>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
